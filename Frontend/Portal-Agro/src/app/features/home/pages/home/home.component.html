<app-carrusel id="carousel"></app-carrusel>

<app-container-card
  id="latest-additions"
  [title]="'Últimos Agregados'"
  [showHeader]="true"
  [loading]="loadingProducts"
  [skeletonCount]="6"
  [products]="products">
</app-container-card>

<app-container-card
  id="featured-products"
  [title]="'Productos Destacados'"
  [showHeader]="true"
  [loading]="loadingFeatured"
  [skeletonCount]="6"
  [products]="productFeatured">
</app-container-card>

<app-button class="d-flex justify-content-center mt-3"
  id="exploreBtn"
  [text]="'Explorar Productos'"
  [type]="'button'"
  [redirectTo]="'/home/product'">
</app-button>
