<div class="form-wrapper-transparent">
  <h2 class="titleForm">{{title}}</h2>
  <form (submit)="save()" [formGroup]="form" class="form-container">
    
    <div class="form-field">
      <mat-form-field appearance="outline" class="custom-mat-field">
        <mat-label>Nombre</mat-label>
        <input [formControl]="form.controls.name" matInput placeholder="Ingrese el nombre del formulario" required>
        <mat-error *ngIf="form.controls.name.hasError('required')">
          El nombre es obligatorio
        </mat-error>
        <mat-error *ngIf="form.controls.name.hasError('minlength')">
          El nombre debe tener al menos 3 caracteres
        </mat-error>
        <mat-error *ngIf="form.controls.name.hasError('maxlength')">
          El nombre no puede exceder los 50 caracteres
        </mat-error>
      </mat-form-field>
    </div>

    <div class="form-field">
      <mat-form-field appearance="outline" class="custom-mat-field">
        <mat-label>Descripción</mat-label>
        <textarea [formControl]="form.controls.description" matInput
                  placeholder="Describa el propósito del formulario" rows="3"></textarea>
        <mat-error *ngIf="form.controls.description.hasError('maxlength')">
          La descripción no puede exceder los 255 caracteres
        </mat-error>
      </mat-form-field>
    </div>

    <div class="form-field">
      <mat-form-field appearance="outline" class="custom-mat-field">
        <mat-label>Url</mat-label>
        <textarea [formControl]="form.controls.url" matInput
                  placeholder="Escriba la URL del Formulario" rows="3"></textarea>
        <mat-error *ngIf="form.controls.url.hasError('maxlength')">
          La Url no puede exceder los 255 caracteres
        </mat-error>
      </mat-form-field>
    </div>

    <div class="form-actions cont-botones">
      <!-- <button type="submit" mat-flat-button color="primary" [disabled]="form.invalid" class="btn-custom">
        <mat-icon>save</mat-icon> Guardar
      </button> -->
      <app-button [text]="'Guardar'" [icon]="'save'" [type]="'submit'" [disabled]="form.invalid"></app-button>
      <!-- <a mat-stroked-button color="warn" routerLink="/account/security/form">
        <mat-icon>cancel</mat-icon> Cancelar
      </a> -->
      <app-button [text]="'Cancelar'" [icon]="'cancel'" [color]="'secondary'" [back]="true"></app-button>

    </div>
  </form>
</div>
