<!-- rol-form-form.component.html -->
<div class="form-wrapper-transparent">
  <h2 class="titleForm">{{ title }}</h2>

  <form (submit)="save()" [formGroup]="form" class="form-container">
    <!-- Formulario -->
    <div class="form-field">
      <mat-form-field appearance="outline" class="custom-mat-field">
        <mat-label>Formulario</mat-label>
        <mat-select [formControl]="form.controls.formId" required>
          <mat-option [value]="0" disabled>Seleccione un formulario</mat-option>
          <mat-option *ngFor="let u of forms" [value]="u.id">
            {{ u.name }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="form.controls.formId.hasError('required') || form.controls.formId.value === 0">
          El formulario es obligatorio
        </mat-error>
      </mat-form-field>
    </div>

    <!-- Modulo -->
    <div class="form-field">
      <mat-form-field appearance="outline" class="custom-mat-field">
        <mat-label>Modulo</mat-label>
        <mat-select [formControl]="form.controls.moduleId" required>
          <mat-option [value]="0" disabled>Seleccione un rol</mat-option>
          <mat-option *ngFor="let r of modules" [value]="r.id">
            {{ r.name }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="form.controls.moduleId.hasError('required') || form.controls.moduleId.value === 0">
          El rol es obligatorio
        </mat-error>
      </mat-form-field>
    </div>

    <!-- Acciones -->
    <div class="form-actions cont-botones">
      <app-button
        [text]="'Guardar'"
        [icon]="'save'"
        [type]="'submit'"
        [disabled]="form.invalid || form.controls.formId.value === 0 || form.controls.moduleId.value === 0">
      </app-button>

      <app-button
        [text]="'Cancelar'"
        [icon]="'cancel'"
        [color]="'secondary'"
        [back]="true">
      </app-button>
    </div>
  </form>
</div>
