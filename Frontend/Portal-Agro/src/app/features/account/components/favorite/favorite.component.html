<!-- favorite.component.html -->
<h2 class="info-title">Mis Favoritos</h2>

<app-container-card-flex
  [products]="products"
  [showFavorite]="true"
  [togglingId]="togglingId"
  (toggleFavorite)="onToggleFavorite($event)">
</app-container-card-flex>

<!-- Puedes añadir un estado vacío si lo deseas -->
<div *ngIf="products.length === 0" class="empty">
  No tienes productos en favoritos todavía.
</div>
