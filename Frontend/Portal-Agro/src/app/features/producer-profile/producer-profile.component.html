<div class="container my-3 profile-container">
  <div class="card shadow-lg p-4 rounded-4">

    <!-- HEADER -->
    <div class="row align-items-center text-center text-md-start">
      <div class="row align-items-center">
        <!-- FOTO DE PERFIL -->
        <div class="col-md-6 mb-3 d-flex flex-column align-items-center">
          <img [src]="'https://cdn-icons-png.freepik.com/256/5447/5447108.png?semt=ais_white_label'"
            class="rounded-circle shadow-sm mb-3 img-profile" alt="Foto productor" width="150" height="150">
          <h4 class="fw-bold">{{ producer?.fullName }}</h4>
          <p class="text-muted">{{ producer?.email }}</p>
          <p class="mb-1">
            <span>📞 {{producer?.phoneNumber }}</span>
          </p>
        </div>

        <!-- QR -->
        <div class="col-md-6 d-flex justify-content-md-end justify-content-center">
          <img [src]="producer?.qrUrl || 'https://cdn-icons-png.flaticon.com/512/2089/2089670.png'" width="150" alt="QR"
            class="shadow-sm rounded">
        </div>
      </div>
    </div>
    <hr>

    <!-- Descripción -->
    <section class="my-4" *ngIf="producer?.description">
      <h5 class="title">Descripción</h5>
      <p class="text-secondary">{{ producer?.description }}</p>
    </section>


    <section class="my-4">
      <h5 class="mb-3 title">Productos</h5>
      <app-container-card-productor [items]="products" [type]="'product'">
      </app-container-card-productor>
    </section>

    <section class="my-4">
      <h5 class="mb-3 title">Fincas</h5>
      <app-container-card-productor [items]="famrs" [type]="'farm'">
      </app-container-card-productor>
    </section>

    <!-- FINCAS 
    <section class="my-4">
      <h5 class="mb-3 title">Fincas</h5>
      <div class="d-flex flex-nowrap gap-4 overflow-x-auto justify-content-start justify-content-md-center">
        <app-card-farm *ngFor="let farm of famrs" [farm]="farm"></app-card-farm>
      </div>
    </section>-->

    <!-- PRODUCTOS (ahora con contenedor + carrusel de cards) ¿
    <section class="my-4">
      <app-container-card
        [title]="'Productos Disponibles'"
        [showHeader]="true"
        [products]="products">
      </app-container-card>
    </section>
-->
  </div>
</div>
