<app-button
  text="Crear Producto"
  color="primary"
  icon="add"
  redirectTo="/account/producer/management/product/create">
</app-button>

<div class="container-xxl px-3">
  <div class="row g-4">
    <div
      class="col-12 col-sm-6 col-md-4 col-lg-3"
      *ngFor="let product of products; trackBy: trackById">
      <app-card [product]="product" [showActions]="true"></app-card>
    </div>
  </div>
</div>
