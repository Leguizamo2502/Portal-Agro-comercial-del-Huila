<section class="producer-layout">
  <header class="header">
    <h1 class="title-p">Productor</h1>
  </header>

  <!-- Tabs superiores enlazadas a rutas -->
  <nav mat-tab-nav-bar>
    <a
      mat-tab-link
      *ngFor="let t of tabs"
      [routerLink]="t.path"
      routerLinkActive
      #rla="routerLinkActive"
      [active]="rla.isActive"
    >
      {{ t.label }}
    </a>
  </nav>

  <!-- Contenido de la ruta hija -->
  <router-outlet></router-outlet>
</section>
