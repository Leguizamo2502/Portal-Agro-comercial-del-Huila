<section class="product-section">
  <h2 class="section-title" *ngIf="showHeader">{{ title }}</h2>

  <div class="product-container">
    <app-card *ngFor="let p of products; trackBy: trackById" [product]="p" [showFavorite]="true"
      [isFavorite]="p.isFavorite" [showActions]="false" [disabledFavorite]="togglingId === p.id"
      (toggleFavorite)="onToggleFavorite($event)">
    </app-card>
  </div>
</section>
