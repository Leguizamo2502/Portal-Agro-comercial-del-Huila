<button [type]="type"
        [disabled]="disabled"
        (click)="onClick()"
        [ngClass]="{
          'btn-primary': color === 'primary',
          'btn-danger': color === 'danger'
        }"
        class="custom-btn">
        <mat-icon *ngIf="icon" class="icon">{{icon}}</mat-icon>

  <!-- <i *ngIf="icon" class="{{ icon }}" aria-hidden="true" style="margin-right: 6px;"></i> -->
  {{ text }}
</button>
